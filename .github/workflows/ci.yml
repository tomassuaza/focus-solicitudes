# =============================================================
# CI pipeline - Sistema Unico de Solicitudes (Focus)
#
# En cada push y PR a main:
#   1) Backend: build + tests unitarios e integracion + checkstyle + SpotBugs +
#               JaCoCo gate (>=80% modulos criticos) + scan CVE OWASP
#   2) Frontend: lint + tests + build + audit npm
#   3) Trivy filesystem scan (CVE en todo el repo)
#
# Los fallos se distinguen por tipo (steps separados).
# Quality gates BLOQUEANTES (NO continue-on-error excepto donde se justifica):
#   - JaCoCo: bloquea si cobertura < 80% modulos criticos
#   - SpotBugs: bloquea si encuentra bugs medium o mayor
#   - ESLint: bloquea si hay errores de lint
#   - npm audit: bloquea si hay CVE high o critical
#   - Trivy: bloquea si hay CVE high o critical en repo
#
# No se hace deploy automatico - el despliegue a Render/Vercel es manual.
# =============================================================
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (Java + Spring Boot)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build (compile)
        run: mvn -B -ntp compile

      - name: Analisis estatico (Checkstyle)
        run: mvn -B -ntp checkstyle:check

      - name: Tests unitarios + integracion
        env:
          SPRING_PROFILES_ACTIVE: test
        run: mvn -B -ntp test

      - name: Quality gate (JaCoCo >=80% modulos criticos)
        run: mvn -B -ntp verify -DskipITs=false

      - name: SpotBugs (analisis estatico de bugs)
        run: mvn -B -ntp spotbugs:check

      - name: Subir reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: backend/target/site/jacoco/
          if-no-files-found: ignore

  frontend:
    name: Frontend (React + Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci || npm install --no-audit --no-fund

      - name: Lint (ESLint) - quality gate bloqueante
        run: npm run lint

      - name: Tests con cobertura
        run: npm run test:coverage

      - name: Build de produccion
        run: npm run build

      - name: Auditoria de CVE en dependencias (npm audit)
        # Bloquea si hay vulnerabilidades de severidad high o critical.
        # Checklist seguridad #7.
        run: npm audit --audit-level=high

      - name: Subir bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          if-no-files-found: ignore

  security-scan:
    name: Trivy filesystem scan (CVE)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Trivy filesystem scan
        # Cumple checklist de seguridad #7: scan automatico de vulnerabilidades
        # criticas y altas en TODO el repositorio (codigo, dependencias, configs).
        # Bloquea el merge si encuentra CVE critico o alto sin fix disponible
        # (ignore-unfixed evita falsos positivos).
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          exit-code: '1'

  # Gate final: el merge a main requiere que TODOS los jobs pasen.
  # Esto se aplica con branch protection rules en GitHub (manual una sola vez).
