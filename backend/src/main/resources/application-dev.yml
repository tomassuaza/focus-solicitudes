# Perfil de desarrollo: H2 in-memory, auth simplificada
spring:
  datasource:
    url: jdbc:h2:mem:focus;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration

focus:
  google:
    client-id: dev-client-id
    allowed-domain: dev.local
