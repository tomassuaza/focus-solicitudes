spring:
  datasource:
    url: jdbc:h2:mem:test;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

focus:
  google:
    client-id: test-client-id
    allowed-domain: test.local
  jwt:
    secret: test-jwt-secret-with-at-least-32-characters-for-hs256
