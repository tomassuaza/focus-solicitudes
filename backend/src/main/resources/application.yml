spring:
  application:
    name: focus-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: ${DB_URL:jdbc:h2:mem:focus;MODE=MySQL;DB_CLOSE_DELAY=-1}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  error:
    include-message: always

# Configuración propia
focus:
  google:
    client-id: ${GOOGLE_OAUTH_CLIENT_ID:}
    allowed-domain: ${GOOGLE_ALLOWED_DOMAIN:}
  jwt:
    secret: ${JWT_SECRET:cambia-esto-por-uno-aleatorio-de-al-menos-32-caracteres}
    expiration-minutes: 480
  cors:
    allowed-origins: ${FRONTEND_URL:http://localhost:5173}
  notificaciones:
    from: ${SMTP_USER:no-reply@focusagency.co}

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    com.focus: INFO
    org.springframework.security: WARN
